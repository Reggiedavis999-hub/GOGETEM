<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dash &amp; Flex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0b0b0d; }
      body { overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
      /* iPhone Safari zooms into any field smaller than 16px; keep fields at 16px so the page never jumps */
      input, textarea, select { font-size: 16px !important; }
    </style>
  </head>
  <body>
    <noscript>Dashin &amp; Flexin needs JavaScript turned on.</noscript>
    <div id="root"></div>
  </body>
</html>
